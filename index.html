<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- SPA redirect receiver (GitHub Pages) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mihlab-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>MIHLab | The Moral Imagination and Hope Laboratory</title>
    <meta name="description" content="The Moral Imagination and Hope Laboratory explores how art shapes who we become. A philosophical laboratory at the intersection of ethics, art, and human experience." />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MIHLab | The Moral Imagination and Hope Laboratory" />
    <meta property="og:description" content="A philosophical laboratory exploring how art shapes who we become through games, music, and visual media." />
    <meta property="og:site_name" content="MIHLab" />
    <meta property="og:url" content="https://mihlab.org/" />
    <meta property="og:image" content="https://mihlab.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MIHLab.org lettering in front of the Earth seen from orbit" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mihlab.org/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
